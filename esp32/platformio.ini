; AgriEdge Rover — ESP32 Firmware (PlatformIO)
; PLACEHOLDER pin configuration — update config/hardware.yaml when wiring is finalized

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
  -D MOCK_SENSORS=1
  -D FIRMWARE_VERSION=\"0.1.0\"

lib_deps =
  bblanchon/ArduinoJson@^7.0.0
  milesburton/DallasTemperature@^3.11.0
  adafruit/DHT sensor library@^1.4.6

; Pin definitions loaded from include/pins.h (placeholders until hardware team confirms)
